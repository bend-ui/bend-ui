name: 'Chromatic - React Aria components'

# Automatic visual testing currently focuses on the Base UI adapter.
# Keep this workflow available for explicit manual runs.
on:
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm exec nx run react-aria:build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_ARIA }}
          storybookBuildDir: dist/storybook/react-aria
          exitOnceUploaded: true
