name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [build, lint, test, typecheck]
    env:
      # Nx Cloud org is disabled (free plan exceeded), so use a local cache persisted via actions/cache.
      NX_NO_CLOUD: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ matrix.target }}-${{ runner.os }}-

      - name: Run affected ${{ matrix.target }}
        run: pnpm nx affected -t ${{ matrix.target }} --exclude=tag:status:parked

      - name: Verify packed Panda consumer
        if: matrix.target == 'build'
        run: pnpm nx run panda-consumer:verify
