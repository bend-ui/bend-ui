name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [build, lint, test, typecheck]
    env:
      # Nx Cloud org is disabled (free plan exceeded), so use a local cache persisted via actions/cache.
      NX_NO_CLOUD: 'true'
      # Pin both locations inside the workspace. Nx 24 otherwise keeps them under ~/.nx/<id>/, which actions/cache does not capture.
      NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
      NX_WORKSPACE_DATA_DIRECTORY: ${{ github.workspace }}/.nx/workspace-data
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nx indexes cached task outputs in a SQLite database whose filename embeds a
      # machine ID. A database restored from another runner is ignored (0% hits),
      # so record this runner's name first and adopt the restored database under it.
      - name: Record Nx database name
        run: |
          pnpm nx show projects > /dev/null
          ls .nx/workspace-data/*-v6.db > "$RUNNER_TEMP/nx-db-name"

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: nx-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ matrix.target }}-${{ runner.os }}-

      - name: Adopt restored Nx database
        run: |
          current=$(cat "$RUNNER_TEMP/nx-db-name")
          for restored in .nx/workspace-data/*-v6.db; do
            [ "$restored" = "$current" ] && continue
            for ext in "" -wal -shm; do
              if [ -f "$restored$ext" ]; then mv -f "$restored$ext" "$current$ext"; fi
            done
          done

      - name: Run affected ${{ matrix.target }}
        run: pnpm nx affected -t ${{ matrix.target }} --exclude=tag:status:parked

      - name: Verify packed Panda consumer
        if: matrix.target == 'build'
        run: pnpm nx run panda-consumer:verify
