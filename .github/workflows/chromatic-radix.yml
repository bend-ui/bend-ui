name: 'Chromatic - Radix components'

on:
  push:
    paths:
      - 'packages/radix/**'
    branches-ignore:
      - 'dependabot/**'
      - 'renovate/**'

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm exec nx run radix:build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_RADIX }}
          storybookBuildDir: dist/storybook/radix
          exitOnceUploaded: true
